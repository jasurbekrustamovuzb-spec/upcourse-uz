    <script>
      // Start the small public catalog request while HTML/CSS and the app
      // bundle load. It is safe for signed-in visitors too: the endpoint only
      // returns approved public list metadata.
      (function () {
        if (location.pathname !== '/' || location.search || location.hash) return;
        var controller = new AbortController();
        // Fall back to the direct catalog request sooner on a cold/slow edge.
        var timeout = setTimeout(function () { controller.abort(); }, 2200);
        window.__upcourseInitialCatalogPromise = fetch('/api/public-catalog', {
          signal: controller.signal,
          headers: { Accept: 'application/json' },
          priority: 'high'
        }).then(function (response) {
          if (!response.ok) return null;
          return response.json();
        }).catch(function () { return null; }).finally(function () { clearTimeout(timeout); });
      })();
      // A shared live-room URL should not start with the home skeleton.
      try {
        if (new URLSearchParams(location.search).has('live')) {
          document.documentElement.setAttribute('data-entry', 'live');
        }
      } catch (e) {}
    </script>

    <!-- Route-neutral preloader: navigation and page skeletons belong to the React app. -->
    <style>
      html, body { min-height: 100%; margin: 0; background: #EFE9D6; color: #262A1E; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #20241F; color: #F4F1E7; color-scheme: dark; }
      #upcourse-splash { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: #EFE9D6; color: #1F3D2B; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; transition: opacity .18s ease; }
      html[data-theme="dark"] #upcourse-splash { background: #20241F; color: #F4F1E7; }
      #upcourse-splash.uc-hide { opacity: 0; pointer-events: none; }
      #upcourse-splash * { box-sizing: border-box; }
      .ucs-loading { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.52); }
      html[data-theme="dark"] .ucs-loading { background: rgba(255,255,255,.04); }
      .ucs-mark { display: grid; place-items: center; position: relative; width: 32px; height: 32px; flex: 0 0 auto; padding-bottom: 2px; border: 2px solid #B8863B; border-radius: 9px; color: #B8863B; font: 700 21px/1 Georgia, 'Times New Roman', serif; }
      .ucs-mark::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: 5px; height: 1px; background: currentColor; }
      .ucs-brand { color: inherit; font: 700 18px Georgia, 'Times New Roman', serif; white-space: nowrap; }
      .ucs-spinner { width: 17px; height: 17px; margin-left: 6px; border: 2px solid rgba(184,134,59,.24); border-top-color: #B8863B; border-radius: 50%; animation: ucsSpin .8s linear infinite; }
      .ucs-load-note { position: absolute; top: calc(50% + 45px); max-width: 280px; padding: 0 16px; color: #6c705f; font-size: 12px; text-align: center; }
      html[data-theme="dark"] .ucs-load-note { color: #bdc3b7; }
      .ucs-retry { margin-top: 8px; border: 0; background: transparent; color: #8b6828; font: inherit; font-weight: 650; text-decoration: underline; cursor: pointer; }
      @keyframes ucsSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ucs-spinner { animation-duration: 2s; } #upcourse-splash.uc-hide { transition: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="upcourse-splash" role="status" aria-live="polite" aria-label="UpCourse yuklanmoqda">
        <div class="ucs-loading" aria-hidden="true"><span class="ucs-mark">U</span><span class="ucs-brand">UpCourse Uz</span><span class="ucs-spinner"></span></div>
        <div class="ucs-load-note" id="ucsLoadNote" hidden>Sayt sekin yuklanyapti.<br /><button class="ucs-retry" type="button" onclick="location.reload()">Qayta yuklash</button></div>
      </div>
    <script>
      // Show a recovery hint if the app bundle cannot start; React removes this loader on mount.
      var ucsLoadTimer = setTimeout(function () {
        var note = document.getElementById('ucsLoadNote');
        if (note && document.getElementById('upcourse-splash')) note.hidden = false;
      }, 12000);
      // Once React commits its first page, fade out the route-neutral loader.
      (function () {
        var root = document.getElementById('root');
        var splash = document.getElementById('upcourse-splash');
        if (!root || !splash) return;
        function removeSplash() {
          splash.classList.add('uc-hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
          observer.disconnect();
          clearTimeout(ucsLoadTimer);
        }
        var observer = new MutationObserver(function () {
          for (var i = 0; i < root.childNodes.length; i++) {
            if (root.childNodes[i] !== splash) { removeSplash(); break; }
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
